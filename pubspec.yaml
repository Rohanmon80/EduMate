name: edumate
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  local_auth: ^2.3.0
  flutter_pdfview: ^1.3.2
  share_plus: ^11.1.0

  dio: ^5.4.0
  pdf: ^3.11.3
  printing: ^5.14.2

  excel_community: ^1.0.10
  archive: ^4.0.9
  xml: ^6.6.1

  path_provider: ^2.1.5
  open_filex: ^4.7.0

  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.3
  file_picker: ^10.3.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.1
  http: ^1.6.0





dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/memo/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"


flutter_native_splash:
  color: "#081120"
  image: assets/images/app_logo.png
  android: true
  ios: true